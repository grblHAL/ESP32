<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="670" viewBox="0 0 1240 670" role="img"><title>I2S measured delay versus direct profile estimate</title><desc>Approximate means from 200 acquisitions during implementation. I2S total 16.875 ms; direct total 7.857 ms is a model estimate, not an A/B measurement.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#526780" stroke-width="1.4"/></marker></defs>
<rect width="1240" height="670" fill="#f5f7fb"/>
<text x="36" y="43" font-family="sans-serif" font-size="26" font-weight="700" fill="#162b45">From changed simulated voltage to the first physical STEP edge</text>
<text x="36" y="75" font-family="sans-serif" font-size="17" font-weight="400" fill="#162b45">Measurements during implementation: 200 acquisitions on DLC32 V2.2; approximate means.</text>
<text x="35" y="190" font-family="sans-serif" font-size="18" font-weight="700" fill="#162b45">I2S</text>
<rect x="180" y="165" width="216.095" height="44" fill="#476a98"/>
<rect x="396.095" y="165" width="1.43" height="44" fill="#d5a027"/>
<rect x="397.52500000000003" y="165" width="706.035" height="44" fill="#178565"/>
<rect x="1103.56" y="165" width="4.565" height="44" fill="#ab5178"/>
<text x="180" y="242" font-family="sans-serif" font-size="16" font-weight="400" fill="#162b45">Sample</text>
<text x="1080.125" y="242" font-family="sans-serif" font-size="16" font-weight="400" fill="#162b45">STEP</text>
<text x="900" y="148" font-family="sans-serif" font-size="19" font-weight="700" fill="#162b45">~16.875 ms measured</text>
<text x="35" y="360" font-family="sans-serif" font-size="18" font-weight="700" fill="#162b45">DIRECT model</text>
<rect x="180" y="335" width="216.095" height="44" fill="#476a98"/>
<rect x="396.095" y="335" width="1.43" height="44" fill="#d5a027"/>
<rect x="397.52500000000003" y="335" width="214.61" height="44" fill="#178565"/>
<text x="180" y="412" font-family="sans-serif" font-size="16" font-weight="400" fill="#162b45">Sample</text>
<text x="584.135" y="412" font-family="sans-serif" font-size="16" font-weight="400" fill="#162b45">STEP</text>
<text x="900" y="318" font-family="sans-serif" font-size="19" font-weight="700" fill="#162b45">~7.857 ms model only</text>
<text x="180" y="124" font-family="sans-serif" font-size="16" font-weight="400" fill="#162b45">Same origin and horizontal time scale</text>
<text x="180" y="275" font-family="sans-serif" font-size="17" font-weight="400" fill="#162b45">I2S: 3.929 control + 0.026 submit + 12.837 to recorded EOF + 0.083 to first STEP</text>
<text x="180" y="447" font-family="sans-serif" font-size="17" font-weight="400" fill="#162b45">DIRECT model: same control/submit prefix + 3.902 ms first ramp interval</text>
<rect x="35" y="485" width="1170" height="147" rx="12" fill="#ffffff" stroke="#d3ddea" stroke-width="2"/>
<text x="55" y="519" font-family="sans-serif" font-size="20" font-weight="700" fill="#162b45">~9.018 ms estimated additional delay: measured I2S path compared with the DIRECT ramp model.</text>
<text x="55" y="552" font-family="sans-serif" font-size="17" font-weight="400" fill="#162b45">Observed I2S total: ~14.009-20.834 ms. Direct scheduling and output overhead were not measured.</text>
<text x="55" y="582" font-family="sans-serif" font-size="17" font-weight="400" fill="#162b45">~83 us is the first-step residual from the recorded EOF ISR timestamp; it is not universal per pulse.</text>
<text x="55" y="611" font-family="sans-serif" font-size="17" font-weight="400" fill="#162b45">Captured at board Z STEP output, without external driver/motor. Real ADC and mechanical response excluded.</text>
</svg>
