[platformio]
src_dir = main
include_dir = main

[env]
platform = espressif32 @ 5.3.0
framework = espidf
board = esp32doit-devkit-v1
board_build.partitions = partitions.csv
board_build.embed_files =
    main/embedded/favicon.ico
    main/embedded/ap_login.html
    main/embedded/index.html.gz
build_flags =
    -DOVERRIDE_MY_MACHINE=1
    -DCONFIG_IDF_TARGET_ESP32=1
    -DTHC_TEST_ENABLE=0
    -DTHC_OVERALL_DELAY=0

[env:dlc32-stream]
build_flags =
    ${env.build_flags}
    -DBOARD_MKS_DLC32_V2P0=1
    -DPLASMA_ENABLE=1
    -DSTEP_INJECT_ENABLE=1
    -DSTEP_INJECT_STREAM=1
